<head>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
      background: #080b10;
      color: #f6f7fb;
      --panel: #111722;
      --panel-2: #171f2c;
      --line: #283447;
      --muted: #91a0b5;
      --accent: #72e4c1;
      --hot: #ff536b;
      --cold: #4edcff;
    }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, #1a2938 0, #080b10 43%); }
    button, select, input { font: inherit }
    button, select { color: inherit }
    button { cursor: pointer }
    .app { width: min(560px, 100%); margin: auto; padding: 18px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .top-controls { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .top-control { display: grid; flex: 0 0 auto; width: 38px; height: 38px; place-items: center; padding: 0; border: 1px solid var(--line);
      border-radius: 99px; color: #9eacc0; background: #111722cc; transition: .16s; }
    .top-control svg { width: 19px; height: 19px; }
    .sr-icon { position: relative; display: block; font-size: 15px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .sr-icon.relaxed::after { content: "↗"; position: absolute; top: -5px; right: -5px; font-size: 10px; font-weight: 800; }
    .top-control:hover { color: #e7edf6; border-color: #4c5b70; }
    .top-control.active { color: #06251d; border-color: var(--accent); background: var(--accent); box-shadow: 0 5px 20px #72e4c124; }
    .top-control:disabled { opacity: .35; cursor: not-allowed; }
    .language { min-width: 42px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 99px;
      color: #c9d3e0; background: #111722cc; font-size: 12px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .logo { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 12px; box-shadow: 0 8px 30px #dd26292b; overflow: hidden; }
    .logo svg { display: block; width: 100%; height: 100%; }
    h1 { margin: 0; font-size: 21px; line-height: 1.1; letter-spacing: -.3px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .workspace { display: block; min-width: 0; }
    .viewer, .panel { min-width: 0; border: 1px solid var(--line); background: #0d121bda; border-radius: 20px; box-shadow: 0 20px 70px #0008; }
    .viewer { padding: 11px; }
    .screen { position: relative; width: min(100%, 480px); height: 640px; margin: auto; aspect-ratio: 3/4; overflow: hidden;
      border-radius: 14px; background: #020305; box-shadow: inset 0 0 0 1px #ffffff0d; touch-action: pan-y; }
    .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { pointer-events: none; }
    .compare-line { position: absolute; z-index: 3; top: 0; bottom: 0; left: 50%; width: 36px; display: none;
      transform: translateX(-50%); cursor: ew-resize; touch-action: none; pointer-events: auto;
      background: linear-gradient(90deg, transparent 16px, #fff 17px, #fff 19px, transparent 20px);
      filter: drop-shadow(0 0 7px #000); }
    .compare-line::after { content: ""; position: absolute; top: 12px; left: 50%; width: 36px; height: 22px;
      transform: translateX(-50%); border: 2px solid #fff; border-radius: 12px; background: #111d; box-shadow: 0 3px 12px #000a; }
    .compare-line::before { content: ""; position: absolute; z-index: 1; top: 21px; left: 50%; width: 10px; height: 2px;
      transform: translateX(-50%); border-radius: 2px; background: #fff; box-shadow: 0 -4px #fff, 0 4px #fff; }
    .screen.comparing .compare-line { display: block; }
    .loading { position: absolute; z-index: 5; left: 50%; bottom: 12px; transform: translateX(-50%); display: none;
      padding: 7px 11px; border: 1px solid #ffffff1a; border-radius: 99px; background: #090d12dc; color: #d8e0eb; font-size: 12px; }
    .loading.show { display: block; }
    .viewer-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 4px 1px;
      color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .viewer-foot strong { color: #e8edf5; font-weight: 650; }
    .capture-actions { position: absolute; z-index: 4; left: 50%; bottom: 14px; display: flex; gap: 12px; transform: translateX(-50%); }
    .capture { display: grid; width: 46px; height: 46px; place-items: center; padding: 0; border: 1px solid #ffffff3b;
      border-radius: 50%; color: #f5f8fc; background: #1017229e; box-shadow: 0 5px 20px #0008; backdrop-filter: blur(7px); }
    .capture svg { width: 21px; height: 21px; }
    .capture:hover { border-color: #ffffff73; background: #182232c7; }
    .capture:disabled { opacity: .42; cursor: not-allowed; }
    .capture.recording { border-color: #934455; color: #ffd7df; background: #351a21; }
    .record-icon { width: 13px; height: 13px; border-radius: 50%; background: #ff536b; box-shadow: 0 0 0 4px #ff536b1e; transition: .16s; }
    .capture.recording .record-icon { width: 12px; height: 12px; border-radius: 2px; box-shadow: 0 0 0 4px #ff536b18; }
    .capture-message { position: absolute; z-index: 4; left: 50%; bottom: 70px; max-width: calc(100% - 24px); padding: 6px 10px;
      transform: translateX(-50%) translateY(4px); border: 1px solid #ffffff1a; border-radius: 99px; color: #e3e9f1; background: #090d12c9;
      font-size: 11px; text-align: center; white-space: nowrap; opacity: 0; pointer-events: none; transition: .18s; backdrop-filter: blur(6px); }
    .capture-message.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .panel { margin-top: 14px; padding: 14px; }
    .section { min-width: 0; }
    .section + .section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #253042; }
    .section-title { margin: 0 0 9px; color: #aab6c7; font-size: 12px; font-weight: 650; letter-spacing: .04em; }
    .select-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .field { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    select { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #2d394c; border-radius: 10px; outline: 0;
      background: #151d29; font-size: 13px; }
    select:focus { border-color: #4d8f7e; }
    .palette-strip { display: flex; width: 100%; max-width: 100%; gap: 8px; margin: 0; padding: 1px 0 8px; overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #3c4a60 transparent; }
    .palette-option { flex: 0 0 82px; padding: 5px; border: 1px solid #2b374a; border-radius: 10px; background: #121925;
      color: #aeb9c8; scroll-snap-align: start; text-align: left; }
    .palette-option canvas { display: block; width: 70px; height: 52px; border-radius: 6px; background: #020305; image-rendering: auto; }
    .palette-option span { display: block; padding: 5px 2px 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .palette-option.active { border-color: var(--accent); color: #ecfff9; background: #183128; box-shadow: 0 0 0 1px #72e4c125; }
    .select-row { grid-template-columns: 1fr; }
    details { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: #0d121bcc; overflow: hidden; }
    summary { cursor: pointer; padding: 13px 14px; color: #b4c0d0; font-size: 13px; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; float: right; color: var(--muted); font-size: 18px; line-height: 14px; }
    details[open] summary::after { content: "−"; }
    .details-body { padding: 0 14px 14px; }
    .diagnostics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-bottom: 14px; }
    .diag { padding: 9px; border-radius: 9px; background: #151d29; }
    .diag span { display: block; color: var(--muted); font-size: 10px; }
    .diag strong { display: block; margin-top: 4px; font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .update { padding-top: 13px; border-top: 1px solid #253042; }
    .update h2 { margin: 0 0 4px; font-size: 14px; }
    .update p { margin: 0 0 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .file-row { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
    input[type=file] { min-width: 0; padding: 8px; border: 1px dashed #35445a; border-radius: 9px; color: var(--muted); font-size: 11px; }
    .segment-box { display: flex; align-items: center; gap: 3px; min-width: 0; padding: 7px 10px; border: 1px solid #35445a; border-radius: 9px; color: var(--muted); font-size: 12px; }
    .segment-box input { width: 54px; padding: 3px 5px; border: 0; border-radius: 5px; color: var(--text); background: #111824; text-align: center; }
    .primary { padding: 9px 12px; border: 0; border-radius: 9px; color: #052018; background: var(--accent); font-weight: 750; }
    .primary:disabled { opacity: .5; cursor: wait; }
    progress { width: 100%; height: 6px; margin-top: 9px; accent-color: var(--accent); }
    #otaMessage { min-height: 16px; margin-top: 5px; }
    @media (max-width: 760px) {
      body { background: #080b10; }
      .app { padding: 10px 0 18px; }
      .topbar { justify-content: flex-start; gap: 6px; padding: 0 12px; }
      .brand { min-width: 0; gap: 8px; }
      .logo { width: 34px; height: 34px; border-radius: 10px; }
      h1 { font-size: 18px; white-space: nowrap; }
      .subtitle { display: none; }
      .top-controls { gap: 4px; margin-left: auto; }
      .top-control { width: 34px; height: 34px; }
      .top-actions { gap: 4px; }
      .language { min-width: 36px; height: 34px; padding: 0 7px; }
      .viewer, .panel { border-left: 0; border-right: 0; border-radius: 0; box-shadow: none; }
      .viewer { padding: 0; border-top: 1px solid #1e2937; }
      .screen { width: 100%; height: 133.333vw; max-width: none; border-radius: 0; }
      .viewer-foot { padding: 9px 12px; }
      .panel { margin-top: 9px; padding: 12px; }
      .palette-strip { margin-inline: 0; padding-inline: 0; }
      details { margin: 9px 10px 0; }
    }
    @media (max-width: 370px) {
      .top-control { width: 33px; height: 33px; }
      .language { min-width: 34px; }

      .panel { padding-inline: 9px; }

        captureContext.strokeStyle = '#fff'; captureContext.lineWidth = 1; captureContext.stroke();
      }
    }
    function captureName(extension) {
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace('T', '_').slice(0, 15);
      return 'T160_' + stamp + '.' + extension;
    }
    function saveBlob(blob, extension) {
      const url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = captureName(extension); link.style.display = 'none';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    function setCaptureMessage(text, persistent) {
      clearTimeout(captureMessageTimer); captureMessageTimer = 0;
      const message = $('captureMessage'); message.textContent = text || ''; message.classList.toggle('show', !!text);
      if (text && !persistent) captureMessageTimer = setTimeout(() => message.classList.remove('show'), 2200);
    }
    $('snapshot').onclick = () => {
      if (!surfaces.raw.gray) { setCaptureMessage(tr('capture_wait_photo')); return; }
      drawCaptureFrame();
      captureCanvas.toBlob(blob => {
        if (!blob) { setCaptureMessage(tr('photo_failed')); return; }
        saveBlob(blob, 'png'); setCaptureMessage(tr('photo_saved'));
      }, 'image/png');
    };
    function recordLabel(text) { $('record').setAttribute('aria-label', text); $('record').title = text; }
    function recordingTime() {
      const seconds = Math.floor((performance.now() - recordStarted) / 1000);
      return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    }
    function stopRecording() {
      if (!recorder || recorder.state === 'inactive') return;
      recorder.stop();
    }
    function startRecording() {
      if (!surfaces.raw.gray) { setCaptureMessage(tr('capture_wait_video')); return; }
      const mimeTypes = ['video/mp4;codecs=h264', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
      drawCaptureFrame(); recordStream = captureCanvas.captureStream(15); recordChunks = [];
      try { recorder = new MediaRecorder(recordStream, mimeType ? {mimeType, videoBitsPerSecond: 1500000} : {videoBitsPerSecond: 1500000}); }
      catch (error) {
        recordStream.getTracks().forEach(track => track.stop()); recordStream = null;
        setCaptureMessage(tr('video_start_failed')); return;
      }
      recorder.ondataavailable = event => { if (event.data.size) recordChunks.push(event.data); };
      recorder.onerror = () => { setCaptureMessage(tr('video_interrupted')); };
      recorder.onstop = () => {
        clearInterval(recordTimer); clearInterval(recordClock); recordTimer = recordClock = 0;
        if (recordStream) recordStream.getTracks().forEach(track => track.stop());
        const type = recorder.mimeType || 'video/webm', extension = type.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordChunks, {type});
        if (blob.size) { saveBlob(blob, extension); setCaptureMessage(tr('video_saved')); }
        else setCaptureMessage(tr('video_failed'));
        $('record').classList.remove('recording'); recordLabel(tr('record_start'));
        recorder = null; recordStream = null; recordChunks = [];
      };
      recorder.start(1000); recordStarted = performance.now();
      recordTimer = setInterval(drawCaptureFrame, 66);
      recordClock = setInterval(() => {
        const time = recordingTime(); recordLabel(format('record_stop', {time})); setCaptureMessage(tr('recording') + ' · ' + time, true);
      }, 500);
      $('record').classList.add('recording'); recordLabel(format('record_stop', {time: '00:00'}));
      setCaptureMessage(tr('recording') + ' · 00:00', true);
    }
    $('record').onclick = () => recorder && recorder.state !== 'inactive' ? stopRecording() : startRecording();
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
      $('record').disabled = true; setCaptureMessage(tr('photo_only'), true);
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopRecording(); });
    fetch('/api/v1/network', {cache: 'no-store'}).then(response => response.ok ? response.json() : null).then(info => {
      if (info && Number.isInteger(info.segment)) $('networkSegment').value = info.segment;
    }).catch(() => {});
    $('saveNetwork').onclick = async () => {
      const segment = Number($('networkSegment').value);
      if (!Number.isInteger(segment) || segment < 1 || segment > 254) { $('networkMessage').textContent = tr('network_invalid'); return; }
      if (!confirm(format('network_confirm', {segment}))) return;
      if (controller) { controller.abort(); controller = null; }
      $('saveNetwork').disabled = true; $('networkMessage').textContent = tr('network_saving');
      try {
        const response = await fetch('/api/v1/network', {method: 'PUT', headers: {'Content-Type': 'application/json', 'X-Sipeed-Request': '1'}, body: JSON.stringify({segment})});
        if (response.status !== 202) throw Error('network update failed');
        $('networkMessage').textContent = tr('network_saved');
        setTimeout(() => { location.href = 'http://192.168.' + segment + '.1/'; }, 3000);
      } catch (error) {
        $('networkMessage').textContent = tr('network_failed'); $('saveNetwork').disabled = false; stream();
      }
    };
    function waitForBoot() { fetch('/api/v1/ota/status?t=' + Date.now(), {cache: 'no-store'}).then(response => response.ok ? location.reload() : setTimeout(waitForBoot, 500)).catch(() => setTimeout(waitForBoot, 500)); }
    $('update').onclick = () => {
      const file = $('firmware').files[0];
      if (!file) { $('otaMessage').textContent = tr('select_first'); return; }
      if (!/\.bin$/i.test(file.name)) { $('otaMessage').textContent = tr('select_bin'); return; }
      if (!confirm(format('install_confirm', {name: file.name}))) return;
      if (controller) { controller.abort(); controller = null; }
      $('update').disabled = true; $('otaMessage').textContent = tr('writing');
      const request = new XMLHttpRequest(); request.open('POST', '/api/v1/ota'); request.setRequestHeader('Content-Type', 'application/octet-stream'); request.setRequestHeader('X-Sipeed-Request', '1');
      request.upload.onprogress = event => { if (event.lengthComputable) $('otaProgress').value = event.loaded * 100 / event.total; };
      request.onload = () => {
        if (request.status === 202) { $('otaProgress').value = 100; $('otaMessage').textContent = tr('update_done'); setTimeout(waitForBoot, 2500); }
        else { $('otaMessage').textContent = tr('update_failed'); $('update').disabled = false; stream(); }
      };
      request.onerror = () => { $('otaMessage').textContent = tr('connection_lost'); $('update').disabled = false; stream(); };
      request.send(file);
    };
    createPaletteButtons(); setLut('iron'); applyLanguage(); refreshControls(); stream(); loadModel('fast').catch(() => {});
  })();
  </script>
</body>
